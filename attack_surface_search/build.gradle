plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

//group = 'com.example'
//version = '1.0.0'

repositories {
    mavenCentral()
}

//springBoot {
//    mainClass = 'com.example.Application'
//}

dependencies {
    implementation 'org.projectlombok:lombok:1.18.28'
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Основной модуль для работы с объектами (POJO)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'

    // Дополнительно: поддержка Java 8 (времена/даты) — рекомендуется
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.0'
    // Основное ядро для генерации классов из JSON
    implementation 'org.jsonschema2pojo:jsonschema2pojo-core:1.2.1'

    // Аннотации Jackson (нужны, если вы выбрали AnnotationStyle.JACKSON2 в коде)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.15.2'

    // Дополнительно: javax.annotation (часто требуется для сгенерированного кода)
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    // javaparser
    implementation 'com.github.javaparser:javaparser-symbol-solver-core:3.25.10'
    // spoon
//    implementation 'fr.inria.gforge.spoon:spoon-core:10.4.0'
    implementation 'fr.inria.gforge.spoon:spoon-core:11.2.0'
    // Эта библиотека просто направит логи Spoon в консоль
//    implementation 'org.slf4j:slf4j-simple:2.0.9'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.google.code.gson:gson:2.10.1'

//    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // H2 Database (in-memory для тестов)
    runtimeOnly 'com.h2database:h2'

    // Для JSON полей
    implementation 'com.vladmihalcea:hibernate-types-55:2.21.1'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Явно указываем logback
    implementation 'ch.qos.logback:logback-classic'

//    // Исключаем slf4j-simple
//    implementation('org.slf4j:slf4j-api') {
//        version {
//            strictly '2.0.9'
//        }
//    }
}

test {
    useJUnitPlatform()
}
