<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Tree Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f0f0;  /* вместо градиента */
            min-height: 100vh;
            padding: 20px;
        }

        #root {
            max-width: 90%;
            margin: 0 auto;
        }
    </style>
</head>
<body>
<div id="root"></div>
</body>
</html>
